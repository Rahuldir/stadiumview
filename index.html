<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CRICMAX — StadiumView</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #050505;
    font-family: 'Titillium Web', Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  /* F1 LOADER */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(45deg,
        rgba(255,255,255,0.018) 0px,
        rgba(255,255,255,0.018) 2px,
        transparent 2px, transparent 9px),
      repeating-linear-gradient(-45deg,
        rgba(255,255,255,0.012) 0px,
        rgba(255,255,255,0.012) 2px,
        transparent 2px, transparent 9px),
      radial-gradient(ellipse at 50% 35%, #1a0808 0%, #0a0505 45%, #030303 100%);
    transition: opacity .7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader::before, #loader::after {
    content: '';
    position: absolute; bottom: 0; width: 220px; height: 220px;
    background: repeating-linear-gradient(-55deg,
      rgba(225,6,0,.55) 0 6px, transparent 6px 16px);
    opacity: .25; pointer-events: none;
  }
  #loader::before { left: 0;  clip-path: polygon(0 100%, 0 40%, 100% 100%); }
  #loader::after  { right: 0; clip-path: polygon(100% 100%, 100% 40%, 0 100%); }

  .f1-stage {
    width: min(920px, calc(100vw - 48px));
    padding: 40px 44px 34px;
    background: linear-gradient(135deg, rgba(15,10,10,.92), rgba(8,8,10,.94));
    border: 1px solid rgba(255,255,255,.06);
    border-left: 3px solid #e10600;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    box-shadow: 0 40px 120px rgba(0,0,0,.9), 0 0 0 1px rgba(225,6,0,.15) inset;
    position: relative; overflow: hidden;
  }
  .f1-stage::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 200px; height: 3px;
    background: linear-gradient(90deg, transparent, #e10600);
  }
  .f1-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 30px; }
  .f1-brand { display: flex; flex-direction: column; gap: 4px; }
  .f1-mark {
    font-family: 'Titillium Web', Arial, sans-serif;
    font-weight: 900; font-style: italic;
    font-size: clamp(48px, 8vw, 88px);
    letter-spacing: 3px; line-height: 1;
    color: #ffffff;
    text-shadow: 5px 5px 0 #e10600, 5px 5px 0 #e10600, 10px 10px 24px rgba(225,6,0,.35);
    transform: skewX(-6deg); margin-left: -4px;
  }
  .f1-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: #7a8590; margin-left: 4px;
  }
  .f1-meta { display: flex; flex-direction: column; gap: 6px; text-align: right; min-width: 200px; padding-top: 8px; }
  .f1-meta-row {
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 10px; letter-spacing: 2.5px;
    color: #7a8590; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,.05); padding-bottom: 4px;
  }
  .f1-meta-row b { color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; }
  .f1-meta-row b.live { color: #e10600; }

  .f1-lights {
    display: flex; gap: 12px; justify-content: center;
    margin: 8px 0 30px; padding: 18px 0;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.2));
    border-top: 1px solid rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .f1-light {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a, #0a0a0a 70%);
    border: 2px solid #1a1a1a;
    box-shadow: inset 0 0 8px rgba(0,0,0,.9);
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  .f1-light::after {
    content: ''; position: absolute; inset: 4px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.15), transparent 60%);
  }
  .f1-light.on {
    background: radial-gradient(circle at 35% 30%, #ff3030, #e10600 55%, #7a0400 100%);
    border-color: #ff4040;
    box-shadow: 0 0 22px rgba(225,6,0,.95), 0 0 44px rgba(225,6,0,.5), inset 0 0 12px rgba(255,255,255,.35);
  }
  .f1-light.go {
    background: radial-gradient(circle at 35% 30%, #7dff9e, #00e676 55%, #005a2c 100%);
    border-color: #7dff9e;
    box-shadow: 0 0 26px rgba(0,230,118,.95), 0 0 52px rgba(0,230,118,.55), inset 0 0 12px rgba(255,255,255,.4);
  }

  .f1-status { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .f1-status-main {
    font-size: 22px; font-weight: 900; font-style: italic;
    letter-spacing: 4px; text-transform: uppercase; color: #fff;
    text-shadow: 2px 2px 0 #e10600;
  }
  .f1-status-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 2px;
    color: #7a8590; text-transform: uppercase;
  }

  .f1-bar {
    position: relative; width: 100%; height: 8px;
    background: rgba(255,255,255,.04); overflow: hidden;
    margin-bottom: 22px; border-left: 3px solid #e10600;
  }
  .f1-bar::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.12) 39px 40px);
    pointer-events: none;
  }
  .f1-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #e10600 0%, #ff4000 40%, #ffb800 100%);
    box-shadow: 0 0 18px rgba(255,64,0,.7);
    transition: width .35s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .f1-bar-fill::after {
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 24px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9));
    animation: f1-scan 1.1s linear infinite;
  }
  @keyframes f1-scan { 0% { opacity: .35; } 50% { opacity: 1; } 100% { opacity: .35; } }

  .f1-telemetry {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.05);
  }
  .f1-tel { background: rgba(8,8,10,.9); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .f1-tel-l { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; color: #7a8590; font-weight: 600; }
  .f1-tel-v { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .f1-tel-v.ok { color: #00e676; }
  .f1-tel-v.warn { color: #ffb800; }

  /* HUD */
  #modelListPanel {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    background: rgba(8,8,12,.78);
    border: 1px solid rgba(255,255,255,.08);
    border-left: 3px solid #e10600;
    border-radius: 2px; padding: 10px 14px; min-width: 180px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #modelListPanel .title { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #7a8590; margin-bottom: 8px; font-weight: 700; }
  #modelList { font-size: 12px; line-height: 1.7; font-family: 'JetBrains Mono', monospace; }
  #modelList .row { color: #cfd6dd; }
  #modelList .row.ok   { color: #00e676; }
  #modelList .row.fail { color: #ef4444; }
  #modelList .row.wait { color: #ffb800; }

  #fps {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    background: rgba(8,8,12,.78);
    border: 1px solid rgba(255,255,255,.08);
    border-right: 3px solid #e10600;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 2px; color: #00e676;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }

  #controls {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%); z-index: 200;
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center; gap: 6px;
    padding: 10px 14px;
    background: rgba(8,8,12,.85);
    border: 1px solid rgba(255,255,255,.08);
    border-top: 2px solid #e10600;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    max-width: calc(100vw - 32px);
  }
  #controls button {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #cfd6dd;
    font-family: 'Titillium Web', Arial, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    padding: 8px 12px; border-radius: 3px; cursor: pointer;
    text-transform: uppercase; transition: all .15s ease; white-space: nowrap;
  }
  #controls button:hover { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.18); }
  #controls button.on {
    background: rgba(0,230,118,.14); color: #00e676;
    border-color: rgba(0,230,118,.5);
    box-shadow: 0 0 14px rgba(0,230,118,.35);
  }
  #btn-auto {
    background: rgba(225,6,0,.14) !important;
    color: #ff5050 !important;
    border-color: rgba(225,6,0,.4) !important;
  }
  #btn-auto.on {
    background: rgba(225,6,0,.3) !important;
    color: #fff !important;
    border-color: #e10600 !important;
    box-shadow: 0 0 16px rgba(225,6,0,.5);
  }
  #controls button[data-time] { font-size: 14px; padding: 6px 10px; }

  @media (max-width: 640px) {
    #controls button { font-size: 9px; padding: 6px 8px; letter-spacing: 1px; }
    .f1-stage { padding: 28px 22px 24px; }
    .f1-mark { font-size: 48px; text-shadow: 3px 3px 0 #e10600, 3px 3px 0 #e10600, 6px 6px 14px rgba(225,6,0,.35); }
    .f1-lights { gap: 8px; }
    .f1-light { width: 28px; height: 28px; }
    .f1-telemetry { grid-template-columns: repeat(2, 1fr); }
    .f1-meta { display: none; }
    #modelListPanel { min-width: 140px; padding: 8px 10px; }
    #modelList { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     F1-STYLE LOADER OVERLAY
     ═══════════════════════════════════════════════════════════ -->
<div id="loader">
  <div class="f1-stage">
    <div class="f1-top">
      <div class="f1-brand">
        <div class="f1-mark">CRICMAX</div>
        <div class="f1-tag">StadiumView · Match Viewer</div>
      </div>
      <div class="f1-meta">
        <div class="f1-meta-row"><span>Session</span><b>Match · 001</b></div>
        <div class="f1-meta-row"><span>Track</span><b>Stadium Oval</b></div>
        <div class="f1-meta-row"><span>Feed</span><b class="live">LIVE</b></div>
      </div>
    </div>

    <div class="f1-lights">
      <div class="f1-light"></div>
      <div class="f1-light"></div>
      <div class="f1-light"></div>
      <div class="f1-light"></div>
      <div class="f1-light"></div>
    </div>

    <div class="f1-status">
      <div class="f1-status-main" id="loaderText">Loading</div>
      <div class="f1-status-sub" id="loaderSub">0 / 0 models</div>
    </div>

    <div class="f1-bar">
      <div class="f1-bar-fill" id="f1BarFill"></div>
    </div>

    <div class="f1-telemetry">
      <div class="f1-tel"><div class="f1-tel-l">Progress</div><div class="f1-tel-v" id="f1Pct">0%</div></div>
      <div class="f1-tel"><div class="f1-tel-l">Loaded</div><div class="f1-tel-v" id="f1Count">0 / 0</div></div>
      <div class="f1-tel"><div class="f1-tel-l">Status</div><div class="f1-tel-v warn" id="f1Status">IDLE</div></div>
      <div class="f1-tel"><div class="f1-tel-l">Speed</div><div class="f1-tel-v" id="f1Speed">0.0 m/s</div></div>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="modelListPanel">
  <div class="title">StadiumView</div>
  <div id="modelList"></div>
</div>

<div id="fps">— FPS</div>

<div id="controls">
  <button data-view="overview">Overview</button>
  <button data-view="tv">TV Broadcast</button>
  <button data-view="bowler">Behind Bowler</button>
  <button data-view="closeup">Striker Close-Up</button>
  <button data-view="sideOn">Side On</button>
  <button data-time="day" class="on">☀️</button>
  <button data-time="sunset">🌇</button>
  <button data-time="night">🌙</button>
</div>

<!-- ═══════════════════════════════════════════════════════════
     THREE.JS — EXACTLY ONE COPY OF EACH
     ═══════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<!-- ═══════════════════════════════════════════════════════════
     APP SCRIPTS — order matters, no duplicates
     ═══════════════════════════════════════════════════════════ -->
<script src="stadium.js"></script>
<script src="controls.js"></script>
<script src="anim.js"></script>
<script src="players.js"></script>
<!-- ═══════════════════════════════════════════════════════════
     F1 LOADER WIRING
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  const loaderEl = document.getElementById('loader');
  const subEl    = document.getElementById('loaderSub');
  const textEl   = document.getElementById('loaderText');
  const barEl    = document.getElementById('f1BarFill');
  const pctEl    = document.getElementById('f1Pct');
  const countEl  = document.getElementById('f1Count');
  const statusEl = document.getElementById('f1Status');
  const speedEl  = document.getElementById('f1Speed');
  const lights   = Array.from(document.querySelectorAll('.f1-light'));

  if (!subEl || !barEl) return;

  let lastCount = 0;
  let lastTime  = performance.now();
  let speedVal  = 0;
  let finished  = false;

  function parseProgress(){
    const m = (subEl.textContent || '').match(/(\d+)\s*\/\s*(\d+)/);
    if (!m) return { done: 0, total: 0, pct: 0 };
    const done  = parseInt(m[1], 10);
    const total = parseInt(m[2], 10);
    return { done, total, pct: total ? done / total : 0 };
  }

  function updateLights(pct){
    const litCount = pct >= 1 ? 5 : Math.floor(pct * 5);
    lights.forEach(function(el, i){
      el.classList.toggle('on', !finished && i < litCount);
    });
  }

  function allGo(){
    lights.forEach(function(el){
      el.classList.remove('on');
      el.classList.add('go');
    });
  }

  function update(){
    if (finished) return;

    const p = parseProgress();
    const pctText = Math.round(p.pct * 100);

    barEl.style.width = pctText + '%';
    pctEl.textContent = pctText + '%';
    countEl.textContent = p.done + ' / ' + p.total;

    if (p.total === 0){
      statusEl.textContent = 'INIT';
      statusEl.className = 'f1-tel-v warn';
    } else if (p.pct >= 1){
      statusEl.textContent = 'READY';
      statusEl.className = 'f1-tel-v ok';
    } else {
      statusEl.textContent = 'LOADING';
      statusEl.className = 'f1-tel-v warn';
    }

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    if (dt > 0.25){
      const delta = p.done - lastCount;
      speedVal = speedVal * 0.6 + (delta / dt) * 0.4;
      lastCount = p.done;
      lastTime = now;
      speedEl.textContent = speedVal.toFixed(1) + ' m/s';
    }

    updateLights(p.pct);

    // Stadium.js signals done by setting loaderText → "Ready"
    if (textEl && /ready/i.test(textEl.textContent)){
      finish();
    }
  }

  function finish(){
    if (finished) return;
    finished = true;

    barEl.style.width = '100%';
    pctEl.textContent = '100%';
    statusEl.textContent = 'READY';
    statusEl.className = 'f1-tel-v ok';
    allGo();

    setTimeout(function(){
      if (loaderEl) loaderEl.classList.add('hide');
    }, 800);
  }

  const mo = new MutationObserver(update);
  mo.observe(subEl,  { childList: true, characterData: true, subtree: true });
  mo.observe(textEl, { childList: true, characterData: true, subtree: true });

  setInterval(update, 250);
  update();
})();
</script>

</body>
</html>
