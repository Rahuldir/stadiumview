<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>CRICMAX — StadiumView</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #050505;
    font-family: 'Titillium Web', Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }

  /* ═══════════════════════════════════════════════════════════
     F1 LOADER
     ═══════════════════════════════════════════════════════════ */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 2px, transparent 2px, transparent 9px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 2px, transparent 2px, transparent 9px),
      radial-gradient(ellipse at 50% 35%, #1a0808 0%, #0a0505 45%, #030303 100%);
    transition: opacity .7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader::before, #loader::after {
    content: '';
    position: absolute; bottom: 0; width: 220px; height: 220px;
    background: repeating-linear-gradient(-55deg, rgba(225,6,0,.55) 0 6px, transparent 6px 16px);
    opacity: .25; pointer-events: none;
  }
  #loader::before { left: 0;  clip-path: polygon(0 100%, 0 40%, 100% 100%); }
  #loader::after  { right: 0; clip-path: polygon(100% 100%, 100% 40%, 0 100%); }

  .f1-stage {
    width: min(560px, calc(100vw - 32px));
    padding: 32px 30px 26px;
    background: linear-gradient(135deg, rgba(15,10,10,.92), rgba(8,8,10,.94));
    border: 1px solid rgba(255,255,255,.06);
    border-left: 3px solid #e10600;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    box-shadow: 0 40px 120px rgba(0,0,0,.9), 0 0 0 1px rgba(225,6,0,.15) inset;
    position: relative; overflow: hidden;
  }
  .f1-stage::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 200px; height: 3px;
    background: linear-gradient(90deg, transparent, #e10600);
  }
  .f1-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
  .f1-mark {
    font-weight: 900; font-style: italic;
    font-size: clamp(40px, 10vw, 72px);
    letter-spacing: 3px; line-height: 1;
    color: #fff;
    text-shadow: 5px 5px 0 #e10600, 10px 10px 24px rgba(225,6,0,.35);
    transform: skewX(-6deg); margin-left: -4px;
  }
  .f1-tag { font-size: 10px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: #7a8590; margin-top: 6px; }
  .f1-meta { display: flex; flex-direction: column; gap: 6px; text-align: right; min-width: 160px; padding-top: 4px; }
  .f1-meta-row {
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 9px; letter-spacing: 2px; color: #7a8590; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,.05); padding-bottom: 4px;
  }
  .f1-meta-row b { color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; font-weight: 700; }
  .f1-meta-row b.live { color: #e10600; }

  .f1-lights {
    display: flex; gap: 12px; justify-content: center;
    margin: 8px 0 26px; padding: 16px 0;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.2));
    border-top: 1px solid rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .f1-light {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a, #0a0a0a 70%);
    border: 2px solid #1a1a1a;
    box-shadow: inset 0 0 8px rgba(0,0,0,.9);
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  .f1-light.on {
    background: radial-gradient(circle at 35% 30%, #ff3030, #e10600 55%, #7a0400 100%);
    border-color: #ff4040;
    box-shadow: 0 0 20px rgba(225,6,0,.95), 0 0 40px rgba(225,6,0,.5), inset 0 0 10px rgba(255,255,255,.35);
  }
  .f1-light.go {
    background: radial-gradient(circle at 35% 30%, #7dff9e, #00e676 55%, #005a2c 100%);
    border-color: #7dff9e;
    box-shadow: 0 0 24px rgba(0,230,118,.95), 0 0 48px rgba(0,230,118,.55);
  }

  .f1-status { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .f1-status-main {
    font-size: 20px; font-weight: 900; font-style: italic;
    letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 2px 2px 0 #e10600;
  }
  .f1-status-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: #7a8590; text-transform: uppercase;
  }

  .f1-bar {
    position: relative; width: 100%; height: 6px;
    background: rgba(255,255,255,.04); overflow: hidden;
    margin-bottom: 18px; border-left: 3px solid #e10600;
  }
  .f1-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #e10600 0%, #ff4000 40%, #ffb800 100%);
    box-shadow: 0 0 18px rgba(255,64,0,.7);
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }

  .f1-telemetry {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.05);
  }
  .f1-tel { background: rgba(8,8,10,.9); padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
  .f1-tel-l { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #7a8590; font-weight: 600; }
  .f1-tel-v { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .f1-tel-v.ok { color: #00e676; }
  .f1-tel-v.warn { color: #ffb800; }

  /* ═══════════════════════════════════════════════════════════
     HUD (top bar, tiny)
     ═══════════════════════════════════════════════════════════ */
  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 100; pointer-events: none;
  }
  #hud .pill {
    background: rgba(8,8,12,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-left: 3px solid #e10600;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 1px;
    color: #00e676;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 3px;
    pointer-events: auto;
  }
  #hud .pill.fps { color: #ffb800; border-left-color: #ffb800; }
  #hud .pill.fps.low { color: #ef4444; border-left-color: #ef4444; }

  /* ═══════════════════════════════════════════════════════════
     SINGLE MENU BUTTON
     ═══════════════════════════════════════════════════════════ */
  #menuBtn {
    position: fixed; bottom: 20px; right: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(15,15,20,.95), rgba(8,8,12,.95));
    border: 2px solid rgba(225,6,0,.5);
    color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    z-index: 500; cursor: pointer;
    box-shadow: 0 8px 30px rgba(0,0,0,.8), 0 0 20px rgba(225,6,0,.3);
    transition: transform .15s ease, background .15s ease;
  }
  #menuBtn:active { transform: scale(0.9); }
  #menuBtn.open {
    background: linear-gradient(135deg, #e10600, #7a0400);
    border-color: #ff4040;
    box-shadow: 0 8px 30px rgba(0,0,0,.8), 0 0 30px rgba(225,6,0,.7);
  }

  /* ═══════════════════════════════════════════════════════════
     MENU PANEL
     ═══════════════════════════════════════════════════════════ */
  #menuPanel {
    position: fixed; right: 20px; bottom: 90px;
    width: min(320px, calc(100vw - 40px));
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    background: rgba(8,8,12,.96);
    border: 1px solid rgba(255,255,255,.08);
    border-top: 2px solid #e10600;
    border-radius: 8px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,.9);
    z-index: 499; padding: 14px;
    transform: translateY(20px) scale(0.95);
    opacity: 0; pointer-events: none;
    transition: all .22s cubic-bezier(.34,1.4,.64,1);
  }
  #menuPanel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }

  #menuPanel .section {
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: #7a8590; font-weight: 700;
    margin: 14px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  #menuPanel .section:first-of-type { margin-top: 0; }
  #menuPanel .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  #menuPanel button {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #cfd6dd;
    font-family: 'Titillium Web', Arial, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 8px 10px; border-radius: 4px; cursor: pointer;
    text-transform: uppercase; transition: all .12s ease;
    flex: 1 1 auto; min-width: 80px;
  }
  #menuPanel button:active { transform: scale(0.94); }
  #menuPanel button.on {
    background: rgba(0,230,118,.15); color: #00e676;
    border-color: rgba(0,230,118,.5);
    box-shadow: 0 0 12px rgba(0,230,118,.35);
  }
  #menuPanel button.time {
    flex: 1 1 calc(33% - 4px);
    font-size: 18px; padding: 10px 4px;
  }
  #menuPanel button.danger {
    background: rgba(225,6,0,.15); color: #ff5050;
    border-color: rgba(225,6,0,.4);
  }
  #menuPanel .hint {
    font-size: 10px; color: #7a8590;
    margin-top: 8px; line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ═══════════════════════════════════════════════════════════
     TOAST (bottom-center, brief messages)
     ═══════════════════════════════════════════════════════════ */
  #pc-toast {
    position: fixed; bottom: 92px; left: 50%;
    transform: translateX(-50%);
    background: rgba(8,8,12,.9);
    border-left: 3px solid #00e676;
    border-radius: 3px;
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: #00e676;
    pointer-events: none;
    opacity: 0; transition: opacity .25s ease;
    z-index: 400;
    max-width: calc(100vw - 40px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #pc-toast.show { opacity: 1; }

  /* ═══════════════════════════════════════════════════════════
     MOBILE TWEAKS
     ═══════════════════════════════════════════════════════════ */
  @media (max-width: 640px) {
    .f1-stage { padding: 24px 20px 20px; }
    .f1-mark { font-size: 42px; text-shadow: 3px 3px 0 #e10600, 6px 6px 14px rgba(225,6,0,.35); }
    .f1-lights { gap: 8px; }
    .f1-light { width: 26px; height: 26px; }
    .f1-telemetry { grid-template-columns: repeat(2, 1fr); }
    .f1-meta { display: none; }
    .f1-status-main { font-size: 16px; }
    #hud .pill { font-size: 9px; padding: 4px 8px; }
    #menuBtn { width: 52px; height: 52px; bottom: 16px; right: 16px; font-size: 20px; }
    #menuPanel { right: 12px; bottom: 80px; width: calc(100vw - 24px); padding: 12px; }
    #menuPanel button { font-size: 10px; padding: 7px 8px; min-width: 68px; }
    #menuPanel button.time { font-size: 16px; }
    #pc-toast { bottom: 80px; font-size: 10px; padding: 6px 10px; }
  }
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════
     F1 LOADER WIRING
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  const loaderEl = document.getElementById('loader');
  const subEl    = document.getElementById('loaderSub');
  const textEl   = document.getElementById('loaderText');
  const barEl    = document.getElementById('f1BarFill');
  const pctEl    = document.getElementById('f1Pct');
  const countEl  = document.getElementById('f1Count');
  const statusEl = document.getElementById('f1Status');
  const speedEl  = document.getElementById('f1Speed');
  const lights   = Array.from(document.querySelectorAll('.f1-light'));

  if (!subEl || !barEl) return;

  let lastCount = 0;
  let lastTime  = performance.now();
  let speedVal  = 0;
  let finished  = false;

  function parseProgress(){
    const m = (subEl.textContent || '').match(/(\d+)\s*\/\s*(\d+)/);
    if (!m) return { done: 0, total: 0, pct: 0 };
    const done  = parseInt(m[1], 10);
    const total = parseInt(m[2], 10);
    return { done, total, pct: total ? done / total : 0 };
  }

  function updateLights(pct){
    const litCount = pct >= 1 ? 5 : Math.floor(pct * 5);
    lights.forEach(function(el, i){
      el.classList.toggle('on', !finished && i < litCount);
    });
  }

  function allGo(){
    lights.forEach(function(el){
      el.classList.remove('on');
      el.classList.add('go');
    });
  }

  function update(){
    if (finished) return;

    const p = parseProgress();
    const pctText = Math.round(p.pct * 100);

    barEl.style.width = pctText + '%';
    pctEl.textContent = pctText + '%';
    countEl.textContent = p.done + ' / ' + p.total;

    if (p.total === 0){
      statusEl.textContent = 'INIT';
      statusEl.className = 'f1-tel-v warn';
    } else if (p.pct >= 1){
      statusEl.textContent = 'READY';
      statusEl.className = 'f1-tel-v ok';
    } else {
      statusEl.textContent = 'LOADING';
      statusEl.className = 'f1-tel-v warn';
    }

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    if (dt > 0.25){
      const delta = p.done - lastCount;
      speedVal = speedVal * 0.6 + (delta / dt) * 0.4;
      lastCount = p.done;
      lastTime = now;
      speedEl.textContent = speedVal.toFixed(1) + ' m/s';
    }

    updateLights(p.pct);

    if (textEl && /ready/i.test(textEl.textContent)) finish();
  }

  function finish(){
    if (finished) return;
    finished = true;

    barEl.style.width = '100%';
    pctEl.textContent = '100%';
    statusEl.textContent = 'READY';
    statusEl.className = 'f1-tel-v ok';
    allGo();

    setTimeout(function(){
      if (loaderEl) loaderEl.classList.add('hide');
    }, 800);
  }

  const mo = new MutationObserver(update);
  mo.observe(subEl,  { childList: true, characterData: true, subtree: true });
  mo.observe(textEl, { childList: true, characterData: true, subtree: true });

  setInterval(update, 250);
  update();
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     MENU WIRING
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  const btn   = document.getElementById('menuBtn');
  const panel = document.getElementById('menuPanel');
  if (!btn || !panel) return;

  function closeMenu(){
    panel.classList.remove('open');
    btn.classList.remove('open');
  }
  function toggleMenu(){
    panel.classList.toggle('open');
    btn.classList.toggle('open', panel.classList.contains('open'));
  }

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    toggleMenu();
  });
  panel.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('pointerdown', function(e){
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target) || btn.contains(e.target)) return;
    closeMenu();
  });

  // ─── Populate View buttons ──────────────────────────────
  const viewRow = document.getElementById('viewRow');
  if (viewRow){
    const VIEWS = ['overview','tv','bowler','batsman','closeup','stumps','aerial','sideOn'];
    VIEWS.forEach(function(k){
      const b = document.createElement('button');
      b.setAttribute('data-view', k);
      b.textContent = k.charAt(0).toUpperCase() + k.slice(1);
      viewRow.appendChild(b);
    });
  }

  // ─── Wire view buttons (delegated so it survives re-injection) ──
  document.addEventListener('click', function(e){
    const b = e.target.closest('#viewRow button');
    if (!b) return;
    const name = b.getAttribute('data-view');
    document.querySelectorAll('#viewRow button').forEach(function(x){
      x.classList.toggle('on', x === b);
    });
    if (window.__applyView) window.__applyView(name);
  });

  // ─── Time buttons ───────────────────────────────────────
  document.addEventListener('click', function(e){
    const b = e.target.closest('#timeRow button');
    if (!b) return;
    const mode = b.getAttribute('data-time');
    document.querySelectorAll('#timeRow button').forEach(function(x){
      x.classList.toggle('on', x === b);
    });
    if (window.__setTime) window.__setTime(mode);
  });

  // ─── Populate player row after PlayerControl loads ──────
  const waitPlayers = setInterval(function(){
    if (!window.PlayerControl) return;
    clearInterval(waitPlayers);

    const playerRow = document.getElementById('playerRow');
    if (!playerRow) return;
    playerRow.innerHTML = '';

    const roles = window.PlayerControl.roles;
    roles.forEach(function(role){
      const b = document.createElement('button');
      b.textContent = role.length > 10 ? role.slice(0, 9) + '…' : role;
      b.title = role;
      b.addEventListener('click', function(){
        window.PlayerControl.select(role);
        playerRow.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
      });
      playerRow.appendChild(b);
    });

    // Mark first as selected
    if (playerRow.firstChild) playerRow.firstChild.classList.add('on');
  }, 250);

  // ─── Auto Director + Reset ──────────────────────────────
  const autoBtn = document.getElementById('btn-auto');
  const resetBtn = document.getElementById('btn-reset');

  if (autoBtn){
    let timer = null, idx = 0;
    const order = ['tv','bowler','closeup','sideOn','batsman','stumps','tv','overview'];
    autoBtn.addEventListener('click', function(){
      const on = autoBtn.classList.toggle('on');
      autoBtn.textContent = on ? '⏸ Director' : '▶ Director';
      if (on){
        (function next(){
          if (!autoBtn.classList.contains('on')) return;
          if (window.__applyView) window.__applyView(order[idx % order.length]);
          document.querySelectorAll('#viewRow button').forEach(function(x){
            x.classList.toggle('on', x.getAttribute('data-view') === order[idx % order.length]);
          });
          idx++;
          timer = setTimeout(next, 5000);
        })();
      } else if (timer){
        clearTimeout(timer);
        timer = null;
      }
    });
  }

  if (resetBtn){
    resetBtn.addEventListener('click', function(){
      if (window.PlayerControl) window.PlayerControl.resetAll();
      closeMenu();
    });
  }

  // ─── Drag on canvas → move selected player ──────────────
  // (Simple: raycast to grass plane, teleport selected player)
  const canvas = document.querySelector('canvas');
  if (canvas && window.THREE){
    let dragTimer = null;
    canvas.addEventListener('pointerdown', function(e){
      if (!window.PlayerControl || !window.StadiumView) return;
      // Only if user tapped in bottom half — avoids conflicting with camera drag
      // Actually let camera drag work; we hook Shift+Tap
      if (!e.shiftKey) return;
      dragTimer = performance.now();
    });
    canvas.addEventListener('pointerup', function(e){
      if (!dragTimer) return;
      dragTimer = null;
      if (!e.shiftKey) return;
      const SV = window.StadiumView;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1
      );
      raycaster.setFromCamera(mouse, SV.camera);
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(SV.fieldY || 0));
      const hit = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(plane, hit)){
        const role = window.PlayerControl.selected();
        window.PlayerControl.moveTo(role, hit.x, hit.z, null, 900);
        showToast(role + ' → x=' + hit.x.toFixed(1) + ' z=' + hit.z.toFixed(1));
      }
    });
  }

  // ─── Toast helper (used by menu + players.js) ───────────
  function showToast(msg){
    let el = document.getElementById('pc-toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'pc-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('show'); }, 1600);
  }
  window.showToast = showToast;

  console.log('[Menu] ✅ single-menu UI ready');
})();
</script>

</body>
