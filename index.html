<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CRICMAX — StadiumView</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #050505;
    font-family: 'Titillium Web', Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  /* ═══════════════════════════════════════════════════════════
     F1-STYLE LOADER
     ═══════════════════════════════════════════════════════════ */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(45deg,
        rgba(255,255,255,0.018) 0px,
        rgba(255,255,255,0.018) 2px,
        transparent 2px,
        transparent 9px),
      repeating-linear-gradient(-45deg,
        rgba(255,255,255,0.012) 0px,
        rgba(255,255,255,0.012) 2px,
        transparent 2px,
        transparent 9px),
      radial-gradient(ellipse at 50% 35%, #1a0808 0%, #0a0505 45%, #030303 100%);
    transition: opacity .7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  /* Diagonal speed stripes bottom corners */
  #loader::before, #loader::after {
    content: '';
    position: absolute; bottom: 0; width: 220px; height: 220px;
    background: repeating-linear-gradient(
      -55deg,
      rgba(225,6,0,.55) 0 6px,
      transparent 6px 16px
    );
    opacity: .25;
    pointer-events: none;
  }
  #loader::before { left: 0;  clip-path: polygon(0 100%, 0 40%, 100% 100%); }
  #loader::after  { right: 0; clip-path: polygon(100% 100%, 100% 40%, 0 100%); }

  /* ─── STAGE ─────────────────────────────────────────────── */
  .f1-stage {
    width: min(920px, calc(100vw - 48px));
    padding: 40px 44px 34px;
    background: linear-gradient(135deg, rgba(15,10,10,.92), rgba(8,8,10,.94));
    border: 1px solid rgba(255,255,255,.06);
    border-left: 3px solid #e10600;
    clip-path: polygon(
      0 0,
      calc(100% - 22px) 0,
      100% 22px,
      100% 100%,
      22px 100%,
      0 calc(100% - 22px)
    );
    box-shadow:
      0 40px 120px rgba(0,0,0,.9),
      0 0 0 1px rgba(225,6,0,.15) inset;
    position: relative;
    overflow: hidden;
  }
  /* Corner red slash */
  .f1-stage::before {
    content: '';
    position: absolute; top: 0; right: 0;
    width: 200px; height: 3px;
    background: linear-gradient(90deg, transparent, #e10600);
  }

  /* ─── TOP ROW ───────────────────────────────────────────── */
  .f1-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 24px; margin-bottom: 30px;
  }
  .f1-brand { display: flex; flex-direction: column; gap: 4px; }

  .f1-mark {
    font-family: 'Titillium Web', Arial, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(48px, 8vw, 88px);
    letter-spacing: 3px;
    line-height: 1;
    color: #ffffff;
    text-shadow:
      5px 5px 0 #e10600,
      5px 5px 0 #e10600,
      10px 10px 24px rgba(225,6,0,.35);
    transform: skewX(-6deg);
    margin-left: -4px;
  }
  .f1-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7a8590;
    margin-left: 4px;
  }

  .f1-meta {
    display: flex; flex-direction: column; gap: 6px;
    text-align: right;
    min-width: 200px;
    padding-top: 8px;
  }
  .f1-meta-row {
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 10px; letter-spacing: 2.5px;
    color: #7a8590; text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,.05);
    padding-bottom: 4px;
  }
  .f1-meta-row b {
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .f1-meta-row b.live { color: #e10600; }

  /* ─── START LIGHTS ──────────────────────────────────────── */
  .f1-lights {
    display: flex; gap: 12px; justify-content: center;
    margin: 8px 0 30px;
    padding: 18px 0;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.2));
    border-top: 1px solid rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .f1-light {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a, #0a0a0a 70%);
    border: 2px solid #1a1a1a;
    box-shadow: inset 0 0 8px rgba(0,0,0,.9);
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  .f1-light::after {
    content: '';
    position: absolute; inset: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.15), transparent 60%);
  }
  .f1-light.on {
    background: radial-gradient(circle at 35% 30%, #ff3030, #e10600 55%, #7a0400 100%);
    border-color: #ff4040;
    box-shadow:
      0 0 22px rgba(225,6,0,.95),
      0 0 44px rgba(225,6,0,.5),
      inset 0 0 12px rgba(255,255,255,.35);
  }
  .f1-light.go {
    background: radial-gradient(circle at 35% 30%, #7dff9e, #00e676 55%, #005a2c 100%);
    border-color: #7dff9e;
    box-shadow:
      0 0 26px rgba(0,230,118,.95),
      0 0 52px rgba(0,230,118,.55),
      inset 0 0 12px rgba(255,255,255,.4);
  }

  /* ─── STATUS TEXT ───────────────────────────────────────── */
  .f1-status {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .f1-status-main {
    font-size: 22px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 2px 2px 0 #e10600;
  }
  .f1-status-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: #7a8590;
    text-transform: uppercase;
  }

  /* ─── PROGRESS BAR ──────────────────────────────────────── */
  .f1-bar {
    position: relative;
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,.04);
    overflow: hidden;
    margin-bottom: 22px;
    border-left: 3px solid #e10600;
  }
  .f1-bar::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0 39px,
      rgba(255,255,255,.12) 39px 40px
    );
    pointer-events: none;
  }
  .f1-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e10600 0%, #ff4000 40%, #ffb800 100%);
    box-shadow: 0 0 18px rgba(255,64,0,.7);
    transition: width .35s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .f1-bar-fill::after {
    content: '';
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 24px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9));
    animation: f1-scan 1.1s linear infinite;
  }
  @keyframes f1-scan {
    0%   { opacity: .35; }
    50%  { opacity: 1; }
    100% { opacity: .35; }
  }

  /* ─── TELEMETRY ─────────────────────────────────────────── */
  .f1-telemetry {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.05);
  }
  .f1-tel {
    background: rgba(8,8,10,.9);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .f1-tel-l {
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #7a8590;
    font-weight: 600;
  }
  .f1-tel-v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .f1-tel-v.ok { color: #00e676; }
  .f1-tel-v.warn { color: #ffb800; }

  /* ─── MODEL LIST PANEL (in-game) ────────────────────────── */
  #modelListPanel {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    background: rgba(8,8,12,.78);
    border: 1px solid rgba(255,255,255,.08);
    border-left: 3px solid #e10600;
    border-radius: 2px;
    padding: 10px 14px; min-width: 180px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #modelListPanel .title {
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: #7a8590; margin-bottom: 8px;
    font-weight: 700;
  }
  #modelList { font-size: 12px; line-height: 1.7; font-family: 'JetBrains Mono', monospace; }
  #modelList .row { color: #cfd6dd; }
  #modelList .row.ok   { color: #00e676; }
  #modelList .row.fail { color: #ef4444; }
  #modelList .row.wait { color: #ffb800; }

  /* ─── FPS ───────────────────────────────────────────────── */
  #fps {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    background: rgba(8,8,12,.78);
    border: 1px solid rgba(255,255,255,.08);
    border-right: 3px solid #e10600;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 2px; color: #00e676;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* ─── CONTROLS BAR ──────────────────────────────────────── */
  #controls {
    position: fixed; left: 50%; bottom: 20px;
    transform: translateX(-50%); z-index: 200;
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    background: rgba(8,8,12,.85);
    border: 1px solid rgba(255,255,255,.08);
    border-top: 2px solid #e10600;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    max-width: calc(100vw - 32px);
  }
  #controls button {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #cfd6dd;
    font-family: 'Titillium Web', Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all .15s ease;
    white-space: nowrap;
  }
  #controls button:hover {
    background: rgba(255,255,255,.12);
    color: #fff;
    border-color: rgba(255,255,255,.18);
  }
  #controls button.on {
    background: rgba(0,230,118,.14);
    color: #00e676;
    border-color: rgba(0,230,118,.5);
    box-shadow: 0 0 14px rgba(0,230,118,.35);
  }
  #btn-auto {
    background: rgba(225,6,0,.14) !important;
    color: #ff5050 !important;
    border-color: rgba(225,6,0,.4) !important;
  }
  #btn-auto.on {
    background: rgba(225,6,0,.3) !important;
    color: #fff !important;
    border-color: #e10600 !important;
    box-shadow: 0 0 16px rgba(225,6,0,.5);
  }
  #controls button[data-time] { font-size: 14px; padding: 6px 10px; }

  @media (max-width: 640px) {
    #controls button { font-size: 9px; padding: 6px 8px; letter-spacing: 1px; }
    .f1-stage { padding: 28px 22px 24px; }
    .f1-mark { font-size: 48px; text-shadow: 3px 3px 0 #e10600, 3px 3px 0 #e10600, 6px 6px 14px rgba(225,6,0,.35); }
    .f1-lights { gap: 8px; }
    .f1-light { width: 28px; height: 28px; }
    .f1-telemetry { grid-template-columns: repeat(2, 1fr); }
    .f1-meta { display: none; }
    #modelListPanel { min-width: 140px; padding: 8px 10px; }
    #modelList { font-size: 11px; }
  }
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════
     F1 LOADER WIRING — reads loaderSub, drives lights + bars
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  const loaderEl  = document.getElementById('loader');
  const subEl     = document.getElementById('loaderSub');
  const textEl    = document.getElementById('loaderText');
  const barEl     = document.getElementById('f1BarFill');
  const pctEl     = document.getElementById('f1Pct');
  const countEl   = document.getElementById('f1Count');
  const statusEl  = document.getElementById('f1Status');
  const speedEl   = document.getElementById('f1Speed');
  const lights    = Array.from(document.querySelectorAll('.f1-light'));

  if (!subEl || !barEl) return;

  let lastCount = 0;
  let lastTime  = performance.now();
  let speedVal  = 0;
  let finished  = false;

  // Parse "X / Y loaded" from loaderSub
  function parseProgress(){
    const m = (subEl.textContent || '').match(/(\d+)\s*\/\s*(\d+)/);
    if (!m) return { done: 0, total: 0, pct: 0 };
    const done = parseInt(m[1], 10);
    const total = parseInt(m[2], 10);
    return { done, total, pct: total ? done / total : 0 };
  }

  // Fill start lights — 5 lights, one per 20% band
  function updateLights(pct){
    const litCount = pct >= 1 ? 5 : Math.floor(pct * 5);
    lights.forEach(function(el, i){
      el.classList.toggle('on', !finished && i < litCount);
    });
  }

  function allGo(){
    lights.forEach(function(el){
      el.classList.remove('on');
      el.classList.add('go');
    });
  }

  function update(){
    if (finished) return;

    const p = parseProgress();

    // Text + bar + telemetry
    const pctText = Math.round(p.pct * 100);
    barEl.style.width = pctText + '%';
    pctEl.textContent = pctText + '%';
    countEl.textContent = p.done + ' / ' + p.total;

    if (p.total === 0){
      statusEl.textContent = 'INIT';
      statusEl.className = 'f1-tel-v warn';
    } else if (p.pct >= 1){
      statusEl.textContent = 'READY';
      statusEl.className = 'f1-tel-v ok';
    } else {
      statusEl.textContent = 'LOADING';
      statusEl.className = 'f1-tel-v warn';
    }

    // Speed = models per second
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    if (dt > 0.25){
      const delta = p.done - lastCount;
      const inst = delta / dt;
      speedVal = speedVal * 0.6 + inst * 0.4;
      lastCount = p.done;
      lastTime = now;
      speedEl.textContent = speedVal.toFixed(1) + ' m/s';
    }

    // Lights
    updateLights(p.pct);

    // Detect "Ready" → 5 lights green, then fade
    if (textEl && /ready/i.test(textEl.textContent)){
      finish();
    }
  }

  function finish(){
    if (finished) return;
    finished = true;

    // Bar to 100%
    barEl.style.width = '100%';
    pctEl.textContent = '100%';
    statusEl.textContent = 'READY';
    statusEl.className = 'f1-tel-v ok';

    // Lights-on-green
    allGo();

    // Hold the green for a beat, then hide
    setTimeout(function(){
      if (loaderEl) loaderEl.classList.add('hide');
    }, 800);
  }

  // Watch for stadium.js writing to loaderSub / loaderText
  const mo = new MutationObserver(update);
  mo.observe(subEl,  { childList: true, characterData: true, subtree: true });
  mo.observe(textEl, { childList: true, characterData: true, subtree: true });

  // Safety net — poll occasionally (in case something writes without mutation)
  setInterval(update, 250);

  // Kick off
  update();
  console.log('[F1Loader] ✅ loaded');
})();
</script> <!-- ═══════════════════════════════════════════════════════════

<script>
(function(){
  console.log('%c[Boot] starting script load sequence', 'color:#e10600;font-weight:bold');
  window.__bootLog = [];

  window.__bootLog.push = function(msg){
    console.log('%c[Boot] ' + msg, 'color:#ffb800');
    Array.prototype.push.call(this, msg);
  };

  // Global uncaught error handler — anything that fails will show here
  window.addEventListener('error', function(e){
    console.error('[Boot] ❌ uncaught error:', e.message, '\n  from:', e.filename, 'line', e.lineno);
  }, true);

  // Script load watchdog — check after 4s whether THREE + StadiumView exist
  setTimeout(function(){
    console.log('%c[Boot] — 4 second health check —', 'color:#e10600;font-weight:bold');
    console.log('[Boot] THREE loaded?        ' + (typeof THREE !== 'undefined' ? '✅' : '❌ MISSING'));
    console.log('[Boot] THREE.GLTFLoader?    ' + (typeof THREE !== 'undefined' && THREE.GLTFLoader ? '✅' : '❌ MISSING'));
    console.log('[Boot] THREE.DRACOLoader?   ' + (typeof THREE !== 'undefined' && THREE.DRACOLoader ? '✅' : '❌ MISSING'));
    console.log('[Boot] window.StadiumView?  ' + (window.StadiumView ? '✅' : '❌ MISSING'));
    console.log('[Boot] window.StadiumAnim?  ' + (window.StadiumAnim ? '✅' : '❌ MISSING'));
    console.log('[Boot] scripts loaded:      ' + window.__bootLog.join(' → '));
  }, 4000);
})();
</script>
