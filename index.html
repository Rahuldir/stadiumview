<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>CRICMAX — StadiumView</title>

<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,700;0,900;1,900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #050505;
    font-family: 'Titillium Web', Arial, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }

  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, #1a0808 0%, #0a0505 45%, #030303 100%);
    transition: opacity .7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .stage {
    width: min(480px, calc(100vw - 32px));
    padding: 30px 28px 24px;
    background: linear-gradient(135deg, rgba(15,10,10,.92), rgba(8,8,10,.94));
    border: 1px solid rgba(255,255,255,.06);
    border-left: 3px solid #e10600;
    box-shadow: 0 40px 120px rgba(0,0,0,.9);
  }
  .mark {
    font-weight: 900; font-style: italic;
    font-size: 52px; letter-spacing: 3px; line-height: 1;
    text-shadow: 5px 5px 0 #e10600, 10px 10px 22px rgba(225,6,0,.35);
    transform: skewX(-6deg); margin-left: -4px;
  }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: 5px; color: #7a8590; margin-top: 6px; }
  .lights { display: flex; gap: 10px; justify-content: center; margin: 22px 0; }
  .light {
    width: 28px; height: 28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a, #0a0a0a 70%);
    border: 2px solid #1a1a1a; transition: all .35s ease;
  }
  .light.on { background: radial-gradient(circle at 35% 30%, #ff3030, #e10600 55%, #7a0400); border-color: #ff4040; box-shadow: 0 0 20px rgba(225,6,0,.9); }
  .light.go { background: radial-gradient(circle at 35% 30%, #7dff9e, #00e676 55%, #005a2c); border-color: #7dff9e; box-shadow: 0 0 22px rgba(0,230,118,.9); }
  .status { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .status .main { font-size: 18px; font-weight: 900; font-style: italic; letter-spacing: 3px; text-transform: uppercase; text-shadow: 2px 2px 0 #e10600; }
  .status .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7a8590; }
  .bar { height: 6px; background: rgba(255,255,255,.04); overflow: hidden; border-left: 3px solid #e10600; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg,#e10600,#ff4000 40%,#ffb800); transition: width .3s ease; }

  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between;
    z-index: 100; pointer-events: none;
  }
  #hud .pill {
    background: rgba(8,8,12,.75);
    border: 1px solid rgba(255,255,255,.08);
    border-left: 3px solid #e10600;
    padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 1px;
    color: #00e676; border-radius: 3px;
  }
  #hud .pill.fps { color: #ffb800; border-left-color: #ffb800; }

  #menuBtn {
    position: fixed; bottom: 20px; right: 20px;
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(15,15,20,.95), rgba(8,8,12,.95));
    border: 2px solid rgba(225,6,0,.5);
    color: #fff; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    z-index: 500; cursor: pointer;
    box-shadow: 0 8px 30px rgba(0,0,0,.8), 0 0 20px rgba(225,6,0,.3);
  }
  #menuBtn:active { transform: scale(0.9); }
  #menuBtn.open { background: linear-gradient(135deg, #e10600, #7a0400); border-color: #ff4040; }

  #menuPanel {
    position: fixed; right: 20px; bottom: 88px;
    width: min(320px, calc(100vw - 40px));
    max-height: calc(100vh - 130px);
    overflow-y: auto;
    background: rgba(8,8,12,.96);
    border: 1px solid rgba(255,255,255,.08);
    border-top: 2px solid #e10600;
    border-radius: 8px;
    backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,.9);
    z-index: 499; padding: 14px;
    transform: translateY(20px) scale(0.95);
    opacity: 0; pointer-events: none;
    transition: all .22s cubic-bezier(.34,1.4,.64,1);
  }
  #menuPanel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .section {
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: #7a8590; font-weight: 700;
    margin: 14px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .section:first-of-type { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #menuPanel button {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: #cfd6dd;
    font-family: 'Titillium Web', Arial, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 8px 10px; border-radius: 4px; cursor: pointer;
    text-transform: uppercase; transition: all .12s ease;
    flex: 1 1 auto; min-width: 76px;
  }
  #menuPanel button:active { transform: scale(0.94); }
  #menuPanel button.on {
    background: rgba(0,230,118,.15); color: #00e676;
    border-color: rgba(0,230,118,.5);
    box-shadow: 0 0 12px rgba(0,230,118,.35);
  }
  #menuPanel button.time { flex: 1 1 calc(33% - 4px); font-size: 18px; padding: 10px 4px; }
  #menuPanel button.danger { background: rgba(225,6,0,.15); color: #ff5050; border-color: rgba(225,6,0,.4); }
  #menuPanel button.auto.on {
    background: rgba(225,6,0,.3) !important;
    color: #fff !important;
    border-color: #ff4040 !important;
    box-shadow: 0 0 16px rgba(225,6,0,.5);
  }
  .hint {
    font-size: 10px; color: #7a8590;
    margin-top: 8px; line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
  }
  #toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%);
    background: rgba(8,8,12,.9);
    border-left: 3px solid #00e676;
    border-radius: 3px;
    padding: 7px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 1.2px;
    text-transform: uppercase; color: #00e676;
    pointer-events: none;
    opacity: 0; transition: opacity .25s ease;
    z-index: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: calc(100vw - 40px);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="loader">
  <div class="stage">
    <div class="mark">CRICMAX</div>
    <div class="tag">STADIUMVIEW</div>
    <div class="lights">
      <div class="light"></div><div class="light"></div>
      <div class="light"></div><div class="light"></div>
      <div class="light"></div>
    </div>
    <div class="status">
      <div class="main" id="loaderText">Loading</div>
      <div class="sub" id="loaderSub">0 / 0</div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
  </div>
</div>

<div id="hud">
  <div class="pill" id="hudInfo">CRICMAX</div>
  <div class="pill fps" id="fps">— FPS</div>
</div>

<div id="menuBtn">☰</div>

<div id="menuPanel">
  <div class="section">Camera Views</div>
  <div class="row" id="viewRow"></div>

  <div class="section">Lighting</div>
  <div class="row" id="timeRow">
    <button class="time" data-time="day">☀️</button>
    <button class="time" data-time="sunset">🌇</button>
    <button class="time" data-time="night">🌙</button>
  </div>

  <div class="section">Actions</div>
  <div class="row">
    <button id="btn-auto" class="auto">▶ Director</button>
    <button id="btn-reset" class="danger">↺ Reset</button>
  </div>

  <div class="section">Player</div>
  <div class="hint">Tap a role · shift+tap field to move<br>Desktop: Tab · WASD · Esc</div>
  <div class="row" id="playerRow"></div>
</div>

<div id="toast"></div>

<!-- Three.js core + loaders -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

<!-- App -->
<script src="stadium.js"></script>
<script src="controls.js"></script>
<script src="players.js"></script>

<!-- Loader + menu wiring -->
<script>
(function(){
  'use strict';

  // ─── Loader progress ────────────────────────────────
  const subEl = document.getElementById('loaderSub');
  const textEl = document.getElementById('loaderText');
  const barEl = document.getElementById('barFill');
  const lights = Array.from(document.querySelectorAll('.light'));
  let loaderDone = false;

  function updateLoader(){
    if (loaderDone) return;
    const m = (subEl.textContent || '').match(/(\d+)\s*\/\s*(\d+)/);
    if (!m) return;
    const n = parseInt(m[1],10), t = parseInt(m[2],10);
    const pct = t ? n / t : 0;
    barEl.style.width = Math.round(pct * 100) + '%';
    const lit = Math.floor(pct * 5);
    lights.forEach((el, i) => el.classList.toggle('on', i < lit));
    if (textEl && /ready/i.test(textEl.textContent) && !loaderDone){
      loaderDone = true;
      barEl.style.width = '100%';
      lights.forEach(el => { el.classList.remove('on'); el.classList.add('go'); });
      setTimeout(() => document.getElementById('loader').classList.add('hide'), 800);
    }
  }
  setInterval(updateLoader, 200);
  new MutationObserver(updateLoader).observe(subEl, { childList:true, characterData:true, subtree:true });

  // ─── Toast ──────────────────────────────────────────
  window.showToast = function(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1500);
  };

  // ─── Menu open/close ────────────────────────────────
  const btn = document.getElementById('menuBtn');
  const panel = document.getElementById('menuPanel');
  btn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('open');
    btn.classList.toggle('open', panel.classList.contains('open'));
  });
  document.addEventListener('pointerdown', e => {
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target) || btn.contains(e.target)) return;
    panel.classList.remove('open');
    btn.classList.remove('open');
  });

  // ─── View buttons ───────────────────────────────────
  const viewRow = document.getElementById('viewRow');
  const VIEWS = ['overview','tv','tvlong','tvhigh','bowler','batsman',
                 'closeup','stumps','sideOn','pitch','aerial','spider','drone'];
  VIEWS.forEach(k => {
    const b = document.createElement('button');
    b.dataset.view = k;
    b.textContent = k.charAt(0).toUpperCase() + k.slice(1);
    b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      if (window.__applyView){
        window.__applyView(k);
        viewRow.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      }
    });
    viewRow.appendChild(b);
  });

  // ─── Time buttons ───────────────────────────────────
  const timeRow = document.getElementById('timeRow');
  timeRow.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      if (window.__setTime){
        window.__setTime(b.dataset.time);
        timeRow.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      }
    });
  });

  // ─── Director ───────────────────────────────────────
  const autoBtn = document.getElementById('btn-auto');
  const resetBtn = document.getElementById('btn-reset');
  const ORDER = ['tv','bowler','closeup','sideOn','batsman','stumps','tvlong','overview'];
  let timer = null, idx = 0;

  function step(){
    if (!autoBtn.classList.contains('on')) return;
    const name = ORDER[idx % ORDER.length];
    idx++;
    if (window.__applyView) window.__applyView(name);
    viewRow.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.view === name));
    timer = setTimeout(step, 5000);
  }

  autoBtn.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const on = autoBtn.classList.toggle('on');
    autoBtn.textContent = on ? '⏸ Director' : '▶ Director';
    if (on){ idx = 0; step(); }
    else { clearTimeout(timer); timer = null; }
  });

  resetBtn.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    if (window.PlayerControl) window.PlayerControl.resetAll();
    panel.classList.remove('open');
    btn.classList.remove('open');
  });

  // ─── Player role buttons ────────────────────────────
  const playerRow = document.getElementById('playerRow');
  const waitPlayers = setInterval(() => {
    if (!window.PlayerControl || !window.PlayerControl.roles) return;
    clearInterval(waitPlayers);
    window.PlayerControl.roles.forEach(role => {
      const b = document.createElement('button');
      b.textContent = role.length > 10 ? role.slice(0, 9) + '…' : role;
      b.title = role;
      b.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        if (window.PlayerControl.select) window.PlayerControl.select(role);
        playerRow.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
      });
      playerRow.appendChild(b);
    });
    if (playerRow.firstChild) playerRow.firstChild.classList.add('on');
  }, 200);

  console.log('[menu] ready');
})();
</script>

</body>
</html>
